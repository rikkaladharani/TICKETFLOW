
spring.application.name=ticketflow-backend
server.port=${PORT:8080}

ticketflow.jwt.secret=${TICKETFLOW_JWT_SECRET:VGhpczElc0FWRVJZU2VjdXJlSldUU2VjcmV0S2V5Rm9yVGlja2V0Rmxvd1Byb2plY3QyMDI2U3VwZXJTZWN1cmU=}
ticketflow.jwt.expiration-ms=86400000

# MySQL (Supports Railway, Render, Docker, and Localhost automatically)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:ticketflow}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${MYSQLUSER:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${MYSQLPASSWORD:root123}}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Frontend development origin
spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,https://ticketflow-frontend.vercel.app,https://ticketflow-frontend-phi.vercel.app}
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
